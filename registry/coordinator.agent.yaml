# Agent card published to Agent Registry.
#
# The version is load-bearing: a bump publishes a NEW row rather than
# overwriting, so you can see what an agent used to be permitted to do. Scopes
# here are the authority the gateway enforces -- an agent absent from the
# registry holds no scopes at all.
apiVersion: agentregistry/v1
kind: Agent
metadata:
  name: coordinator
  version: 0.1.0
  owner_department: "SPED admin (elevated)"
  labels:
    program: special-education
    compliance: idea-part-b
spec:
  model: gemini-3.5-pro
  description: >-
    Supervisor. Routes work, validates every worker return against its schema, retries once, circuit-breaks at three, dead-letters to a human queue.
  identity:
    # Per-agent SPIFFE identity. Deliberately NOT a shared service account:
    # a shared account would make every scope below unenforceable.
    kind: AgentIdentity
    spiffe_id: spiffe://agentx/sped/coordinator
  scopes:
    - case.read
    - case.write
    - worker.invoke
    - skill.review
  gateway:
    policy: agentx-sped-policy
    deny_by_default: true
  guardrails:
    model_armor_template: agentx-skill-review
